# Cloud Wai CI.
#
# Two jobs, because they verify different things and fail for different reasons:
#
#   * verify — build, typecheck and the unit/contract/isolation suite. Fast, and
#     needs nothing but Node.
#   * rls — applies the control-plane migrations to a real PostgreSQL and runs
#     the isolation and job-queue probes. This is the job that proves the RLS
#     matrix rather than asserting it; a mocked database would prove nothing.
#
# Neither job can be skipped: a release gate that only runs when convenient is
# not a gate.
#
# This workflow deliberately does not run on pull requests. This repository works
# directly on `main` (see AGENTS.md), so there are no PRs to build; a push to
# `main` is the only event that matters.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm format:check

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudwai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # The auth shim provides auth.uid() and the Supabase roles the policies
      # reference, so the RLS policies run exactly as they do against Supabase.
      #
      # The migration and probe list lives in `scripts/verify-rls.sh`, not here.
      # It used to be written out in this file as well, which meant a new probe
      # could be added to the script and silently skipped by CI — the same drift
      # the script was refactored to end. `CLOUDWAI_RLS_DSN` points the script at
      # this job's PostgreSQL service instead of booting its own container, and it
      # applies the same SQL either way.
      - name: Isolation and job-queue probes
        env:
          CLOUDWAI_RLS_DSN: postgresql://postgres:postgres@localhost:5432/cloudwai
        run: bash scripts/verify-rls.sh

# Cloud Wai — a single-host deployment.
#
# This is an AWS-EC2-equivalent shape (or any single VM with Docker): one host
# runs the dashboard, the API and the worker; Supabase and the engines (Coolify,
# MinIO, the edge) are external services reached over the network. It is the
# smallest coherent production topology and the one the runbook documents.
#
#   1. Copy `.env.example` to `.env` and fill it in (the runbook lists each key).
#   2. Apply the control-plane migrations to Supabase (see the runbook).
#   3. `docker compose -f infra/deployment/docker-compose.yml up -d --build`
#
# The dashboard is served on :8080 and proxies /rpc and /healthz to the API, so
# the browser has one origin and no CORS allow-list is needed.
#
# Nothing here runs a database: the control plane is Supabase (ADR-0004), and
# tenant databases live behind Coolify (ADR-0011). A local Postgres would be a
# second source of truth.

services:
  api:
    build:
      context: ../..
      dockerfile: infra/deployment/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # The API is reached by the web container over the compose network, never
      # directly from outside; the dashboard container is the only public port.
      HOST: 0.0.0.0
      PORT: "8787"
      NODE_ENV: production
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ../..
      dockerfile: infra/deployment/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started

  # The build plane (ADR-0018). It is the one component that runs untrusted
  # customer source, so it is a separate image and the only service given the
  # Docker socket. The API and worker never receive that mount.
  #
  # It has no published host port: the worker reaches it as `http://builder:8090`
  # inside the compose network, which is the only route in. It is the one engine
  # whose credential is per organization — the control plane reaches it at
  # BUILD_ENGINE_URL__<organizationId> with BUILD_ENGINE_TOKEN__<organizationId>.
  # In this single-host shape one builder serves every tenant and the token is
  # the boundary; a deployment that needs a hard runtime boundary runs a builder
  # per tenant and points each org's URL at its own (see
  # docs/runbooks/build-plane.md).
  #
  # Opt-in via a compose profile: a host that does not run a build plane leaves
  # the build adapter `not_configured`, so a serverless deploy stops for an
  # honest reason rather than a fabricated artifact.
  builder:
    build:
      context: ../..
      dockerfile: infra/deployment/builder.Dockerfile
    profiles: ["build"]
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      BUILDER_PORT: "8090"
      BUILDER_HOST: "0.0.0.0"
      BUILDER_CONCURRENCY: ${BUILDER_CONCURRENCY:-2}
      BUILDER_BUILD_TIMEOUT_MS: ${BUILDER_BUILD_TIMEOUT_MS:-900000}
      BUILDER_MAX_LOG_LINES: ${BUILDER_MAX_LOG_LINES:-5000}
      BUILDER_JOB_TTL_MS: ${BUILDER_JOB_TTL_MS:-3600000}
    # The daemon socket is what makes a build produce an image the runtime can
    # deploy. It is the reason this service is isolated: anything that can talk
    # to the daemon can start a container, so only the builder is given it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Published on loopback only, never a public interface, so nothing off the
    # host can reach the builder directly. This lets the single-host `deploy.sh`
    # shape — where the API and worker run as host processes — reach the builder
    # at 127.0.0.1:8090, while the all-container shape reaches it as
    # http://builder:8090.
    ports:
      - "127.0.0.1:8090:8090"
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # The self-hosted runtime engine — this deployment's own container runtime.
  # It turns "deploy this project" into a running container: it drives the build
  # plane (nixpacks → image) and runs that image on the host daemon, exactly the
  # piece Coolify used to supply. The control plane reaches it through the same
  # hosting port, so nothing above it knows which engine answered.
  #
  # It needs the Docker socket for the same reason the builder does — it starts
  # containers — so it is a separate service with only the API's and worker's
  # network access to it. Opt-in via the `runtime` profile; a host that does not
  # run it leaves the container engine `not_configured` rather than faking a
  # deploy.
  runtime:
    build:
      context: ../..
      dockerfile: infra/deployment/runtime.Dockerfile
    profiles: ["runtime"]
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      RUNTIME_PORT: "8095"
      RUNTIME_HOST: "127.0.0.1"
      # The builder publishes on host loopback, and this service shares the host
      # network for the same reason the router does, so the address is a real one.
      BUILDER_URL: ${BUILDER_URL:-http://127.0.0.1:8090}
      RUNTIME_DATA_DIR: /data
      RUNTIME_APP_PORT: ${RUNTIME_APP_PORT:-3000}
      RUNTIME_PORT_BASE: ${RUNTIME_PORT_BASE:-18100}
      RUNTIME_PORT_RANGE: ${RUNTIME_PORT_RANGE:-400}
      # The runtime publishes an app's hostname routes to the router, so a
      # verified domain reaches the container. Absent these, an app is still
      # deployed but its hostname is reported as not yet routable.
      ROUTER_URL: ${ROUTER_URL:-http://127.0.0.1:8096}
      ROUTER_TOKEN: ${ROUTER_TOKEN:-}
    # Host networking, so the app ports this runtime publishes on 127.0.0.1 are
    # reachable by the router on the same loopback, and the router's loopback-only
    # admin API is reachable here. Ports are therefore not remapped; the runtime
    # binds 127.0.0.1:8095 itself.
    network_mode: host
    volumes:
      # The daemon socket is what lets a deploy become a running container.
      - /var/run/docker.sock:/var/run/docker.sock
      # App state (which image is live, which port) survives a runtime restart.
      - runtime-state:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8095/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # The router — this deployment's own front door (ADR-0021).
  #
  # The runtime binds each app to a loopback port; the router is what turns a
  # public hostname into that port and terminates TLS for it, the way Vercel's
  # edge does. It is what makes a verified domain actually resolve to a running
  # container instead of merely being recorded as verified.
  #
  # It writes certificates to its data volume and reads ACME account state from
  # the same place, so a restart does not re-request certificates. HTTP :8080 is
  # taken by the dashboard in this shape, so the router listens on :80/:443 and
  # the dashboard is expected to sit behind it (see the runbook).
  router:
    build:
      context: ../..
      dockerfile: infra/deployment/router.Dockerfile
    profiles: ["edge"]
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ROUTER_HTTP_PORT: "80"
      ROUTER_HTTPS_PORT: "443"
      ROUTER_ADMIN_PORT: "8096"
      ROUTER_ADMIN_HOST: "127.0.0.1"
      ROUTER_HOST: "0.0.0.0"
      ROUTER_DATA_DIR: /data
      ROUTER_TOKEN: ${ROUTER_TOKEN:-}
      ROUTER_ACME_EMAIL: ${ROUTER_ACME_EMAIL:-}
      ROUTER_DEFAULT_UPSTREAM: ${ROUTER_DEFAULT_UPSTREAM:-}
    # Host networking, so the router's loopback-only admin API (127.0.0.1:8096)
    # is the same loopback the runtime publishes app ports on. That is what lets
    # the runtime hand the router a `127.0.0.1:<port>` upstream it can actually
    # reach, while the admin API stays off every public interface.
    network_mode: host
    volumes:
      - router-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8096/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: infra/deployment/web.Dockerfile
      args:
        # Same-origin: the dashboard calls the API's own path, which nginx
        # proxies. An empty value makes the client use a relative `/rpc`.
        #
        # These are compiled into the bundle. Supply them as shell environment
        # variables at build time (see the runbook); only the anon/publishable
        # key belongs here — never the service-role key.
        VITE_CLOUD_WAI_API_URL: ""
        VITE_SUPABASE_URL: "$VITE_SUPABASE_URL"
        VITE_SUPABASE_ANON_KEY: "$VITE_SUPABASE_ANON_KEY"
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8787
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  # Which image is live for each app, and its host port. Without it a runtime
  # restart loses the mapping and a redeploy would hand a new port to apps that
  # are still running on the old one.
  runtime-state:
  # Issued certificates and the ACME account key. Persisted so a restart does not
  # re-request a certificate and risk a rate limit.
  router-data:

# nginx configuration for the Cloud Wai dashboard.
#
# Two jobs:
#   1. Serve the dashboard bundle, and answer any unknown path with index.html so
#      a deep link or a reload lands on the app rather than a 404.
#   2. Reverse-proxy `/rpc` and `/healthz` to the API, so the browser talks to one
#      origin. Same-origin means no CORS allow-list is involved; the API's
#      `CLOUD_WAI_ALLOWED_ORIGINS` stays empty.
#
# This file is a template: `envsubst` replaces `${API_UPSTREAM}` at container
# start, so the image is environment-independent.

# A long-lived immutable cache is safe only for hashed asset filenames. The HTML
# entry point must always be revalidated, or a deploy would keep serving the old
# bundle.
map $sent_http_content_type $cache_control {
  default                    "no-store";
  ~text/html                 "no-cache";
  ~application/javascript    "public, max-age=31536000, immutable";
  ~text/css                  "public, max-age=31536000, immutable";
  ~font/                     "public, max-age=31536000, immutable";
  ~image/                    "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the nginx version.
  server_tokens off;

  # The control plane is per-user; a shared proxy must never cache a response.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /rpc {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API streams logs and bounded engine calls; do not buffer a JSON body,
    # and allow a call to run as long as the adapter timeout plus margin.
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  location = /healthz {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Git webhook deliveries. A provider posts here, not a browser, and the
  # request body must reach the API unmodified — the HMAC is computed over the
  # exact bytes. `proxy_request_buffering off` streams them rather than spooling
  # and replaying them, and every header (the signature lives in one) is
  # forwarded. No CORS and no cache: a delivery is not a page.
  location /hooks/git/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    # nginx drops inherited `add_header` directives once a location declares one,
    # so the security headers are repeated here rather than silently lost.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $cache_control always;
  }
}
